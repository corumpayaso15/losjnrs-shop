<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOSJNRS SHOP</title>

<style>

body{
  margin:0;
  background:#0f0f0f;
  color:white;
  font-family:sans-serif;
}

.header{
  text-align:center;
  padding:40px 20px;
}

.header h1{
  font-size:40px;
}

.products{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:20px;
  padding:20px;
}

.card{
  width:300px;
  background:#1b1b1b;
  border-radius:25px;
  overflow:hidden;
  text-align:center;
  padding-bottom:20px;
}

.card img{
  width:100%;
}

.card h2{
  margin-top:15px;
}

.card p{
  color:#00ff99;
  font-size:20px;
}

button{
  border:none;
  padding:15px 30px;
  border-radius:15px;
  background:#00ff99;
  color:black;
  font-size:16px;
}

.popup{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.8);
  display:none;
  justify-content:center;
  align-items:center;
}

.popup-box{
  background:#1b1b1b;
  padding:30px;
  border-radius:20px;
  text-align:center;
  width:300px;
}

</style>

</head>
<body>

<div class="header">
  <h1>LOSJNRS SHOP</h1>
  <p>Compra rápida y segura</p>
</div>

<div class="products">

<div class="card">
<img src="https://i.imgur.com/8Km9tLL.png">

<h2>Wax Premium</h2>

<p>$850 MXN</p>

<button onclick="buyProduct('Wax Premium')">
Comprar
</button>

</div>

</div>

<div class="popup" id="popup">

<div class="popup-box">

<h2 id="productName"></h2>

<p>Proceder al pago</p>

<a href="https://google.com">

<button>
Pagar ahora
</button>

</a>

<br><br>

<button onclick="closePopup()">
Cerrar
</button>

</div>

</div>

<script>

function buyProduct(product){

document.getElementById(
"popup"
).style.display="flex";

document.getElementById(
"productName"
).innerText=product;

}

function closePopup(){

document.getElementById(
"popup"
).style.display="none";

}

</script>

</body>
</html>
